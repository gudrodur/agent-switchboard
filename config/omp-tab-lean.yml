# Lean MCP overlay for delegated omp tabs. Applied per launch via
# `omp --config` (see OMP_ARGS in omp-tab.sh); the live config.yml is never
# touched. `--mcp full` skips this file and restores today's behaviour.
#
# Why: every omp startup spawns one process per discovered MCP server —
# measured 2026-09-12 at 13 descendants holding ~310 MB PSS on a live tab
# (plus omp itself), so ~five idle tabs pin ~1.5 GB. A delegated tab drives
# from its brief file and coordinates over omp hooks (not MCP), so it needs
# none of them.
#
# How, per omp v18.1.19 (docs/mcp-config.md + packages/coding-agent/src in
# oh-my-pi, re-read 2026-09-13):
# - `disabledProviders` hides every capability from the named discovery
#   sources — MCP servers included, regardless of which tool config
#   (.claude.json, .cursor/mcp.json, …) introduced them. It is global
#   across capabilities, so there is no per-capability "MCP off, skills on"
#   provider switch, and `disabledServers` is NOT a config.yml key at all —
#   it lives in MCP files, so naming servers here is silently ignored
#   (measured: a top-level `disabledServers` naming every server still
#   spawned its children). OMP-native config and extensions stay on.
# - `skills.customDirectories` re-adds the user's Claude skills through the
#   `custom` skills provider, which `disabledProviders: [claude]` does not
#   touch. That is what keeps user skills working under lean. The stanza at
#   the bottom is a commented example: uncomment it and point it at your
#   own skills directory.
# - `mcp.enableProjectConfig: false` excludes the project-root fallback
#   files (`mcp.json` / `.mcp.json`), which no provider id covers.
# - Nested mapping form, not dotted keys: measured 2026-09-13 that a dotted
#   `skills.customDirectories` overlay is silently ignored (probe skill
#   unknown with or without `disabledProviders`) while the nested form
#   below loads it. The old dotted `mcp.enableProjectConfig` is nested
#   for the same reason.
# Proof (headless, stdin closed, 2026-09-13,
# `omp -p --no-session --model opencode-go/muse-spark-1.3-contributor
# --config <this file>` asked to read a user skill and print its first
# heading): prints the heading, peak transitive descendants 0 for the whole
# run; the same run without this file prints it with 12 descendants.
mcp:
  enableProjectConfig: false
disabledProviders:
  - claude
  - codex
  - gemini
  - opencode
  - cursor
  - windsurf
  - marketplace
  - vscode
# User skills back through the custom provider (commented example, not a
# live default: the directory is per-machine — uncomment and point it at
# your own Claude skills directory, e.g. ~/.claude/skills on this machine.
# Without it lean tabs start with zero MCP children but no user skills).
# skills:
#   customDirectories:
#     - ~/.claude/skills
