name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node suites
        run: node --test tests/*.test.mjs
      - name: shell suite (needs kitty remote control; skipped without it)
        run: bash tests/kitty-send.test.sh || [ $? -eq 2 ]
