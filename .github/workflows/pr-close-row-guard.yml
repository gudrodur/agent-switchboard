# Server-side guard: fail a PR whose description would close an issue it only
# mentions. Canonical copy: agent-config templates/pr-close-row-guard/; every
# convention repo carries it byte-identical at .github/workflows/, and
# agent-config's convention-audit.mjs reports a copy that drifts.
#
# GitHub reads a closing keyword (close/closes/closed, fix/fixes/fixed,
# resolve/resolves/resolved) anywhere in a PR description as closing the WHOLE
# issue on merge. Three shapes close one by accident, and this check fails all three:
#   - a keyword + ref + `row(s)`: "Fixes #914 row 1" meant one row and closed
#     all of #914 (agent-switchboard#28, 2026-09-27);
#   - a past-tense keyword mid-sentence: "#28 closed #914 on merge" is
#     narration, and it closes #914 too. A close that is meant sits at the start
#     of its own line ("Fixes #12"); code spans are ignored, like GitHub does.
#   - a keyword in any tense after a negation or inside quotes: "Does NOT
#     close #150" closed samtak-vefur #150 twice (agent-config#1048).
#
# The dev machine's PreToolUse hook (agent-config scripts/pr-close-row-hook.mjs)
# refuses the same shapes before a PR is posted, but only in Claude Code
# sessions; this is the backstop for everything else. The matcher is inlined
# because most of these repos cannot read agent-config; that repo's
# pr-close-row-hook.test.mjs runs this exact script against the hook's own
# functions on one corpus, so the two cannot drift apart unnoticed.
#
# The body travels through the PR_BODY env var, never interpolated into `run:`
# (`${{ }}` inside `run:` is an injection hole). It fails a check and edits
# nothing, so it needs no write scope, and the matcher is inline, so no checkout.
name: pr-close-row-guard

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  guard:
    runs-on: ${{ fromJSON(vars.GUARD_RUNNER_LABELS || '["ubuntu-slim"]') }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Refuse a PR description that closes an issue it only mentions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node -e '
          const CLOSE_ROW_RE = /\b(?:close[sd]?|fix(?:e[sd]?)?|resolve[sd]?)(?:\s*:)?\s+(?:[\w.-]+\/[\w.-]+)?#\d+[,\s:]*rows?\b/i;
          const NARRATIVE_CLOSE_RE = /\b(?:closed|fixed|resolved)(?:[ \t]*:)?[ \t]+(?:[\w.-]+\/[\w.-]+)?#\d+\b/gi;
          const LINE_LEAD_RE = /^[ \t]*(?:(?:[-*+>]|\d+[.)])[ \t]+)*(?:\*\*|__)?[ \t]*$/;
          const CODE_RE = /```[\s\S]*?(?:```|$)|`[^`\n]*`/g;
          const findNarrativeClose = (body) => {
            const text = body.replace(CODE_RE, (c) => (c.startsWith("```") ? "" : "x"));
            for (const line of text.split("\n")) {
              NARRATIVE_CLOSE_RE.lastIndex = 0;
              for (let m = NARRATIVE_CLOSE_RE.exec(line); m !== null; m = NARRATIVE_CLOSE_RE.exec(line)) {
                if (!LINE_LEAD_RE.test(line.slice(0, m.index))) return m[0];
              }
            }
            return null;
          };
          const ANY_CLOSE_RE = /\b(?:close[sd]?|fix(?:e[sd]?)?|resolve[sd]?)(?:[ \t]*:)?[ \t]+(?:[\w.-]+\/[\w.-]+)?#\d+\b/gi;
          const NEGATION_LEAD_RE = /(?:\b(?:not|never|without|no[ \t]+longer)|n[\x27\u2019]t)\**(?:[ \t]+[\w\x27\u2019]+){0,2}[ \t]*\**[ \t]*$/i;
          const findDisclaimedClose = (body) => {
            const text = body.replace(CODE_RE, (c) => (c.startsWith("```") ? "" : "x"));
            for (const line of text.split("\n")) {
              const quoted = [...line.matchAll(/"[^"]*"|\u201c[^\u201d]*\u201d/g)].map((q) => [q.index, q.index + q[0].length]);
              ANY_CLOSE_RE.lastIndex = 0;
              for (let m = ANY_CLOSE_RE.exec(line); m !== null; m = ANY_CLOSE_RE.exec(line)) {
                const end = m.index + m[0].length;
                if (NEGATION_LEAD_RE.test(line.slice(0, m.index))) return m[0];
                if (quoted.some(([a, b]) => a < m.index && end < b)) return m[0];
              }
            }
            return null;
          };
          const body = process.env.PR_BODY ?? "";
          const row = CLOSE_ROW_RE.exec(body);
          if (row) {
            console.error("⛔ PR description closes an issue’s rows with a closing keyword.");
            console.error("   matched: " + row[0]);
            console.error("   rule:    GitHub reads a closing keyword anywhere in a PR description as closing the WHOLE issue — even when the sentence only means some of its rows.");
            console.error("   fix:     write `refs #n` and list the rows.");
            process.exit(1);
          }
          const said = findNarrativeClose(body);
          if (said) {
            console.error("⛔ PR description names an issue after a past-tense closing keyword mid-sentence.");
            console.error("   matched: " + said);
            console.error("   rule:    it reads as narration, but GitHub closes that issue when this PR merges.");
            console.error("   fix:     write `refs #n`; if closing IS meant, put `Fixes #n` at the start of its own line.");
            process.exit(1);
          }
          const disclaimed = findDisclaimedClose(body);
          if (disclaimed) {
            console.error("⛔ PR description puts a closing keyword before an issue ref inside a negation or a quote.");
            console.error("   matched: " + disclaimed);
            console.error("   rule:    GitHub ignores the negation and the quote marks and closes that issue when this PR merges.");
            console.error("   fix:     write `refs #n`, or keep the keyword away from the ref; a quoted keyword can go in a code span.");
            process.exit(1);
          }
          console.log("no accidental closing keyword in the PR description");
          '
